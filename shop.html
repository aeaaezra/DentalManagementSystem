<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shine and Smile Dental Supply</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

        :root {
            --medical-blue: #0ea5e9;
            --medical-mint: #10b981;
            --medical-bg: #f8fafc;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--medical-bg);
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        .stepper-item.active .step-counter { background-color: var(--medical-blue); color: white; }
        .stepper-item.completed .step-counter { background-color: var(--medical-mint); color: white; }

        .product-card:hover .quick-add { opacity: 1; transform: translateY(0); }

        /* Custom Modal Transitions */
        .modal-overlay { transition: opacity 0.3s ease; }
        .modal-content { transition: transform 0.3s ease; }
    </style>
</head>
<body class="text-slate-800">

    <!-- Header Navigation -->
    <header class="sticky top-0 z-50 bg-white border-b border-slate-200 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 h-16 md:h-20 flex items-center justify-between gap-4">
            <!-- Logo -->
            <div onclick="showPage('home')" class="flex items-center gap-2 cursor-pointer group">
                <div class="w-10 h-10 bg-sky-500 rounded-xl flex items-center justify-center text-white shadow-lg shadow-sky-100 transition-transform group-hover:scale-105">
                    <i class="fa-solid fa-tooth text-xl"></i>
                </div>
                <div class="hidden sm:block">
                    <h1 class="text-lg font-bold text-slate-900 leading-tight">Shine & Smile</h1>
                    <p class="text-[10px] text-sky-600 font-bold tracking-widest uppercase">Dental Supply</p>
                </div>
            </div>

            <!-- Search Bar -->
            <div class="flex-1 max-w-xl relative">
                <input type="text" id="searchInput" onkeyup="handleSearch()" placeholder="Search instruments, composites, hygiene..."
                       class="w-full pl-10 pr-4 py-2 bg-slate-100 border-none rounded-full text-sm focus:ring-2 focus:ring-sky-500 transition-all outline-none">
                <i class="fa-solid fa-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 text-xs"></i>
            </div>

            <!-- Action Buttons -->
            <div class="flex items-center gap-2 md:gap-4">
                <button onclick="showPage('history')" class="p-2 text-slate-500 hover:text-sky-600 hover:bg-sky-50 rounded-full transition-colors relative" title="Order History">
                    <i class="fa-solid fa-clock-rotate-left text-lg"></i>
                </button>
                <button onclick="showPage('cart')" class="p-2 text-slate-500 hover:text-sky-600 hover:bg-sky-50 rounded-full transition-colors relative" title="Shopping Cart">
                    <i class="fa-solid fa-cart-shopping text-lg"></i>
                    <span id="cartCount" class="absolute top-0 right-0 bg-rose-500 text-white text-[10px] font-bold w-5 h-5 rounded-full flex items-center justify-center border-2 border-white hidden">0</span>
                </button>
                <div class="w-px h-6 bg-slate-200 mx-1 hidden md:block"></div>
                <div class="flex items-center gap-2 cursor-pointer">
                    <div class="w-8 h-8 rounded-full bg-slate-200 border border-slate-300 flex items-center justify-center overflow-hidden">
                        <img src="https://ui-avatars.com/api/?name=Dr+Smith&background=0ea5e9&color=fff" alt="User">
                    </div>
                    <span class="text-sm font-medium text-slate-700 hidden lg:block">Dr. Smith</span>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content Area -->
    <main id="appContent" class="min-h-[calc(100vh-80px)] pb-20 md:pb-8">
        <!-- Content will be injected here via JS -->
    </main>

    <!-- Mobile Bottom Navigation (Visible on mobile only) -->
    <nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-slate-200 h-16 flex md:hidden items-center justify-around z-50">
        <button onclick="showPage('home')" class="nav-btn flex flex-col items-center gap-1 text-sky-600" id="nav-home">
            <i class="fa-solid fa-house text-lg"></i>
            <span class="text-[10px] font-medium">Home</span>
        </button>
        <button onclick="showPage('cart')" class="nav-btn flex flex-col items-center gap-1 text-slate-400" id="nav-cart">
            <div class="relative">
                <i class="fa-solid fa-cart-shopping text-lg"></i>
                <span id="mobileCartCount" class="absolute -top-1 -right-2 bg-rose-500 text-white text-[8px] px-1 rounded-full hidden">0</span>
            </div>
            <span class="text-[10px] font-medium">Cart</span>
        </button>
        <button onclick="showPage('history')" class="nav-btn flex flex-col items-center gap-1 text-slate-400" id="nav-history">
            <i class="fa-solid fa-box text-lg"></i>
            <span class="text-[10px] font-medium">Orders</span>
        </button>
        <button class="nav-btn flex flex-col items-center gap-1 text-slate-400">
            <i class="fa-solid fa-user text-lg"></i>
            <span class="text-[10px] font-medium">Profile</span>
        </button>
    </nav>

    <!-- Toast Notification Container -->
    <div id="toastContainer" class="fixed top-24 right-4 z-[100] flex flex-col gap-2"></div>

    <script>
        // --- DATA & STATE ---
        const PRODUCTS = [
            { id: 1, name: "Precision Dental Mirror #4", category: "Diagnostic", price: 12.50, stock: 45, image: "https://images.unsplash.com/photo-1628131338278-5651725005f7?auto=format&fit=crop&q=80&w=400", desc: "Front surface rhodium coated for high clarity." },
            { id: 2, name: "Nano-Hybrid Composite Kit", category: "Restorative", price: 89.99, stock: 3, image: "https://images.unsplash.com/photo-1593054942085-f37f374714f3?auto=format&fit=crop&q=80&w=400", desc: "4 syringes including basic shades A1, A2, A3, B1." },
            { id: 3, name: "High-Res Intraoral Sensor", category: "Imaging", price: 1250.00, stock: 12, image: "https://images.unsplash.com/photo-1606811971618-4486d14f3f99?auto=format&fit=crop&q=80&w=400", desc: "Ultra-slim design for maximum patient comfort." },
            { id: 4, name: "Nitrile Gloves - Mint Edition", category: "Hygiene", price: 15.00, stock: 150, image: "https://images.unsplash.com/photo-1584622650111-993a426fbf0a?auto=format&fit=crop&q=80&w=400", desc: "Powder-free, textured fingertips for better grip." },
            { id: 5, name: "LED Fiber Optic Handpiece", category: "Instruments", price: 210.00, stock: 8, image: "https://images.unsplash.com/photo-1468493858157-0da44aaf1d13?auto=format&fit=crop&q=80&w=400", desc: "Triple spray system with ceramic bearings." },
            { id: 6, name: "Fluoride Varnish (Berry Pack)", category: "Preventive", price: 45.00, stock: 25, image: "https://images.unsplash.com/photo-1559757175-0eb30cd8c063?auto=format&fit=crop&q=80&w=400", desc: "Fast-setting, 5% sodium fluoride treatment." },
        ];

        let cart = [];
        let orders = [
            { id: "ORD-9821", date: "2024-04-15", status: "Delivered", total: 145.00, items: 3 },
            { id: "ORD-9950", date: "2024-04-20", status: "In Transit", total: 89.99, items: 1 }
        ];
        let currentCategory = "All";
        let searchQuery = "";

        // --- CORE FUNCTIONS ---

        function init() {
            showPage('home');
            updateCartUI();
        }

        function showPage(pageId, params = null) {
            const content = document.getElementById('appContent');
            window.scrollTo(0, 0);

            // Update mobile nav UI
            document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.replace('text-sky-600', 'text-slate-400'));
            const activeNav = document.getElementById(`nav-${pageId}`);
            if(activeNav) activeNav.classList.replace('text-slate-400', 'text-sky-600');

            switch(pageId) {
                case 'home': renderHome(); break;
                case 'details': renderDetails(params); break;
                case 'cart': renderCart(); break;
                case 'checkout': renderCheckout(); break;
                case 'tracking': renderTracking(params); break;
                case 'history': renderHistory(); break;
            }
        }

        function notify(message, type = 'success') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            const bg = type === 'success' ? 'bg-emerald-500' : 'bg-rose-500';
            const icon = type === 'success' ? 'fa-circle-check' : 'fa-circle-exclamation';

            toast.className = `${bg} text-white px-4 py-3 rounded-lg shadow-xl flex items-center gap-3 animate-bounce-in min-w-[200px] transition-all duration-300`;
            toast.innerHTML = `<i class="fa-solid ${icon}"></i> <span class="text-sm font-medium">${message}</span>`;

            container.appendChild(toast);
            setTimeout(() => {
                toast.classList.add('opacity-0', 'translate-x-full');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        // --- RENDERERS ---

        function renderHome() {
            const filtered = PRODUCTS.filter(p => {
                const matchesCat = currentCategory === "All" || p.category === currentCategory;
                const matchesSearch = p.name.toLowerCase().includes(searchQuery.toLowerCase());
                return matchesCat && matchesSearch;
            });

            const categories = ["All", ...new Set(PRODUCTS.map(p => p.category))];

            document.getElementById('appContent').innerHTML = `
                <div class="max-w-7xl mx-auto px-4 py-6">
                    <!-- Hero Banner -->
                    <div class="bg-gradient-to-br from-sky-600 to-indigo-700 rounded-2xl p-8 md:p-12 mb-8 text-white relative overflow-hidden">
                        <div class="relative z-10 max-w-lg">
                            <span class="inline-block px-3 py-1 bg-white/20 rounded-full text-[10px] font-bold tracking-widest uppercase mb-4">Limited Offer</span>
                            <h2 class="text-3xl md:text-5xl font-extrabold mb-4 leading-tight">Professional Gear for Modern Clinics</h2>
                            <p class="text-sky-100 mb-8 text-sm md:text-base">Get up to 20% off on all imaging tools this month. Fast 24-hour shipping guaranteed.</p>
                            <button class="bg-white text-sky-600 px-8 py-3 rounded-full font-bold shadow-lg hover:shadow-xl transition-all">Explore Sale</button>
                        </div>
                        <i class="fa-solid fa-stethoscope absolute -right-10 -bottom-10 text-[200px] text-white/10 rotate-12"></i>
                    </div>

                    <!-- Category Pills -->
                    <div class="flex gap-2 overflow-x-auto no-scrollbar mb-8 py-2">
                        ${categories.map(cat => `
                            <button onclick="setCategory('${cat}')"
                                    class="px-5 py-2 rounded-full whitespace-nowrap text-xs font-semibold transition-all ${currentCategory === cat ? 'bg-sky-500 text-white shadow-md' : 'bg-white text-slate-500 border border-slate-200 hover:border-sky-300'}">
                                ${cat}
                            </button>
                        `).join('')}
                    </div>

                    <!-- Product Grid -->
                    <div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 xl:grid-cols-6 gap-4 md:gap-6">
                        ${filtered.length ? filtered.map(p => `
                            <div class="product-card group bg-white rounded-xl border border-slate-200 overflow-hidden hover:shadow-xl hover:border-sky-200 transition-all cursor-pointer relative" onclick="showPage('details', ${p.id})">
                                <div class="aspect-square bg-slate-50 relative overflow-hidden">
                                    <img src="${p.image}" alt="${p.name}" class="w-full h-full object-cover transition-transform group-hover:scale-105">
                                    ${p.stock < 5 ? `<div class="absolute top-2 left-2 bg-rose-500 text-white text-[9px] font-bold px-2 py-0.5 rounded">Low Stock</div>` : ''}
                                    <div class="quick-add absolute inset-x-0 bottom-0 p-2 opacity-0 translate-y-4 transition-all">
                                        <button onclick="event.stopPropagation(); addToCart(${p.id})" class="w-full bg-white text-sky-600 py-2 rounded-lg text-xs font-bold shadow-lg hover:bg-sky-50">Quick Add</button>
                                    </div>
                                </div>
                                <div class="p-4">
                                    <p class="text-[10px] text-slate-400 font-bold uppercase mb-1">${p.category}</p>
                                    <h3 class="text-sm font-semibold text-slate-800 h-10 line-clamp-2 mb-2">${p.name}</h3>
                                    <div class="flex items-center justify-between">
                                        <span class="text-sky-600 font-bold">$${p.price.toFixed(2)}</span>
                                        <div class="flex items-center gap-1 text-[10px] text-amber-500">
                                            <i class="fa-solid fa-star"></i>
                                            <span class="text-slate-400">4.9</span>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        `).join('') : `
                            <div class="col-span-full py-20 text-center">
                                <i class="fa-solid fa-magnifying-glass text-slate-200 text-6xl mb-4"></i>
                                <p class="text-slate-400">No products found matching your search.</p>
                            </div>
                        `}
                    </div>
                </div>
            `;
        }

        function renderDetails(productId) {
            const product = PRODUCTS.find(p => p.id === productId);
            if(!product) return showPage('home');

            document.getElementById('appContent').innerHTML = `
                <div class="max-w-5xl mx-auto px-4 py-8">
                    <button onclick="showPage('home')" class="mb-6 flex items-center gap-2 text-slate-500 hover:text-sky-600 transition-colors">
                        <i class="fa-solid fa-arrow-left"></i> Back to products
                    </button>
                    <div class="bg-white rounded-2xl overflow-hidden shadow-sm border border-slate-100 flex flex-col md:flex-row">
                        <div class="w-full md:w-1/2 aspect-square bg-slate-50">
                            <img src="${product.image}" class="w-full h-full object-cover">
                        </div>
                        <div class="w-full md:w-1/2 p-8 flex flex-col">
                            <span class="text-xs font-bold text-sky-600 uppercase mb-2">${product.category}</span>
                            <h1 class="text-2xl md:text-3xl font-bold text-slate-900 mb-4">${product.name}</h1>
                            <div class="flex items-center gap-4 mb-6">
                                <span class="text-3xl font-black text-slate-900">$${product.price.toFixed(2)}</span>
                                <span class="px-2 py-1 bg-emerald-100 text-emerald-600 text-[10px] font-bold rounded">IN STOCK</span>
                            </div>
                            <p class="text-slate-600 mb-8 leading-relaxed">${product.desc}</p>

                            <div class="mt-auto space-y-4">
                                <div class="flex items-center gap-4">
                                    <div class="flex items-center border border-slate-200 rounded-lg">
                                        <button class="p-3 hover:text-sky-600" onclick="updateQtyDetail(-1)"><i class="fa-solid fa-minus"></i></button>
                                        <input type="number" id="detailQty" value="1" class="w-12 text-center font-bold outline-none border-none bg-transparent" readonly>
                                        <button class="p-3 hover:text-sky-600" onclick="updateQtyDetail(1)"><i class="fa-solid fa-plus"></i></button>
                                    </div>
                                    <button onclick="addToCart(${product.id}, parseInt(document.getElementById('detailQty').value))"
                                            class="flex-1 bg-sky-500 text-white py-4 rounded-xl font-bold shadow-lg shadow-sky-100 hover:bg-sky-600 transition-all flex items-center justify-center gap-3">
                                        <i class="fa-solid fa-cart-plus"></i> Add to Cart
                                    </button>
                                </div>
                                <div class="flex items-center justify-between p-4 bg-slate-50 rounded-xl text-xs text-slate-500">
                                    <div class="flex items-center gap-2"><i class="fa-solid fa-truck text-sky-500"></i> Free Shipping</div>
                                    <div class="flex items-center gap-2"><i class="fa-solid fa-shield-halved text-sky-500"></i> 1 Year Warranty</div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderCart() {
            const total = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);

            document.getElementById('appContent').innerHTML = `
                <div class="max-w-5xl mx-auto px-4 py-8">
                    <h1 class="text-2xl font-bold text-slate-900 mb-8 flex items-center gap-3">
                        <i class="fa-solid fa-cart-shopping text-sky-600"></i> Shopping Cart
                    </h1>

                    ${cart.length === 0 ? `
                        <div class="bg-white rounded-2xl p-12 text-center border-2 border-dashed border-slate-200">
                            <div class="w-20 h-20 bg-slate-100 rounded-full flex items-center justify-center mx-auto mb-4 text-slate-300">
                                <i class="fa-solid fa-box-open text-3xl"></i>
                            </div>
                            <h3 class="text-lg font-bold text-slate-800 mb-2">Your cart is empty</h3>
                            <p class="text-slate-500 mb-6">Looks like you haven't added anything yet.</p>
                            <button onclick="showPage('home')" class="bg-sky-500 text-white px-8 py-3 rounded-full font-bold shadow-lg hover:bg-sky-600">Start Shopping</button>
                        </div>
                    ` : `
                        <div class="grid lg:grid-cols-3 gap-8">
                            <div class="lg:col-span-2 space-y-4">
                                ${cart.map(item => `
                                    <div class="bg-white p-4 rounded-xl border border-slate-200 flex items-center gap-4">
                                        <img src="${item.image}" class="w-20 h-20 rounded-lg object-cover bg-slate-50">
                                        <div class="flex-1">
                                            <h3 class="font-semibold text-slate-800 line-clamp-1">${item.name}</h3>
                                            <p class="text-xs text-slate-400 mb-2">${item.category}</p>
                                            <div class="flex items-center justify-between">
                                                <span class="text-sky-600 font-bold">$${item.price.toFixed(2)}</span>
                                                <div class="flex items-center gap-4">
                                                    <div class="flex items-center border border-slate-200 rounded-lg scale-90">
                                                        <button class="px-3 py-1 hover:text-sky-600" onclick="addToCart(${item.id}, -1)"><i class="fa-solid fa-minus text-xs"></i></button>
                                                        <span class="w-8 text-center text-sm font-bold">${item.qty}</span>
                                                        <button class="px-3 py-1 hover:text-sky-600" onclick="addToCart(${item.id}, 1)"><i class="fa-solid fa-plus text-xs"></i></button>
                                                    </div>
                                                    <button onclick="removeFromCart(${item.id})" class="text-slate-300 hover:text-rose-500"><i class="fa-solid fa-trash-can"></i></button>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                `).join('')}
                            </div>
                            <div class="lg:col-span-1">
                                <div class="bg-white p-6 rounded-2xl border border-slate-200 sticky top-24 shadow-sm">
                                    <h4 class="font-bold text-slate-900 mb-4">Summary</h4>
                                    <div class="space-y-3 mb-6 text-sm">
                                        <div class="flex justify-between text-slate-500"><span>Subtotal</span><span>$${total.toFixed(2)}</span></div>
                                        <div class="flex justify-between text-slate-500"><span>Tax (5%)</span><span>$${(total * 0.05).toFixed(2)}</span></div>
                                        <div class="flex justify-between text-slate-500"><span>Shipping</span><span class="text-emerald-500 font-bold">FREE</span></div>
                                        <div class="pt-3 border-t border-slate-100 flex justify-between font-bold text-slate-900 text-lg">
                                            <span>Total</span><span>$${(total * 1.05).toFixed(2)}</span>
                                        </div>
                                    </div>
                                    <button onclick="showPage('checkout')" class="w-full bg-sky-500 text-white py-4 rounded-xl font-bold shadow-lg hover:bg-sky-600 transition-all uppercase tracking-widest text-xs">Proceed to Checkout</button>
                                </div>
                            </div>
                        </div>
                    `}
                </div>
            `;
        }

        function renderCheckout() {
            const total = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
            document.getElementById('appContent').innerHTML = `
                <div class="max-w-4xl mx-auto px-4 py-8">
                    <h1 class="text-2xl font-bold text-slate-900 mb-8">Checkout</h1>
                    <form onsubmit="placeOrder(event)" class="grid md:grid-cols-2 gap-8">
                        <div class="space-y-6">
                            <div class="bg-white p-6 rounded-2xl border border-slate-200">
                                <h3 class="font-bold text-slate-900 mb-4 flex items-center gap-2"><i class="fa-solid fa-location-dot text-sky-500"></i> Shipping Address</h3>
                                <div class="space-y-4">
                                    <input type="text" placeholder="Full Name" required class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl outline-none focus:ring-2 focus:ring-sky-500">
                                    <input type="tel" placeholder="Contact Number" required class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl outline-none focus:ring-2 focus:ring-sky-500">
                                    <textarea placeholder="Complete Clinic Address" rows="3" required class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl outline-none focus:ring-2 focus:ring-sky-500"></textarea>
                                </div>
                            </div>
                            <div class="bg-white p-6 rounded-2xl border border-slate-200">
                                <h3 class="font-bold text-slate-900 mb-4 flex items-center gap-2"><i class="fa-solid fa-credit-card text-sky-500"></i> Payment Method</h3>
                                <div class="grid grid-cols-2 gap-3">
                                    <label class="relative cursor-pointer">
                                        <input type="radio" name="pay" value="cod" checked class="peer sr-only">
                                        <div class="p-4 border-2 border-slate-100 rounded-xl peer-checked:border-sky-500 peer-checked:bg-sky-50 text-center transition-all">
                                            <i class="fa-solid fa-money-bill-wave mb-2 text-slate-400 peer-checked:text-sky-600"></i>
                                            <p class="text-xs font-bold text-slate-600">COD</p>
                                        </div>
                                    </label>
                                    <label class="relative cursor-pointer">
                                        <input type="radio" name="pay" value="card" class="peer sr-only">
                                        <div class="p-4 border-2 border-slate-100 rounded-xl peer-checked:border-sky-500 peer-checked:bg-sky-50 text-center transition-all">
                                            <i class="fa-solid fa-university mb-2 text-slate-400 peer-checked:text-sky-600"></i>
                                            <p class="text-xs font-bold text-slate-600">Online Pay</p>
                                        </div>
                                    </label>
                                </div>
                            </div>
                        </div>
                        <div>
                            <div class="bg-slate-900 text-white p-6 rounded-2xl sticky top-24">
                                <h3 class="font-bold mb-6 text-sky-400">Order Summary</h3>
                                <div class="space-y-4 mb-8 max-h-60 overflow-y-auto pr-2 custom-scroll">
                                    ${cart.map(item => `
                                        <div class="flex justify-between text-sm">
                                            <span class="text-slate-400">${item.qty}x ${item.name}</span>
                                            <span>$${(item.price * item.qty).toFixed(2)}</span>
                                        </div>
                                    `).join('')}
                                </div>
                                <div class="pt-6 border-t border-slate-800 space-y-3">
                                    <div class="flex justify-between text-sm"><span class="text-slate-400">Tax</span><span>$${(total * 0.05).toFixed(2)}</span></div>
                                    <div class="flex justify-between text-xl font-bold text-sky-400 pt-2">
                                        <span>Total</span><span>$${(total * 1.05).toFixed(2)}</span>
                                    </div>
                                </div>
                                <button type="submit" class="w-full bg-sky-500 text-white py-4 rounded-xl mt-8 font-black uppercase tracking-widest hover:bg-sky-400 transition-all shadow-xl shadow-sky-900/20">Confirm & Place Order</button>
                                <p class="text-[10px] text-center text-slate-500 mt-4 italic">By clicking place order, you agree to our Terms of Service.</p>
                            </div>
                        </div>
                    </form>
                </div>
            `;
        }

        function renderTracking(orderId) {
            const steps = [
                { title: "Ordered", icon: "fa-receipt", desc: "Order placed successfully", status: "completed" },
                { title: "Confirmed", icon: "fa-check-circle", desc: "Warehouse confirmed order", status: "completed" },
                { title: "Processing", icon: "fa-gears", desc: "Items being packed", status: "active" },
                { title: "Shipping", icon: "fa-truck-fast", desc: "Handed to courier", status: "pending" },
                { title: "Delivered", icon: "fa-house-circle-check", desc: "Successfully delivered", status: "pending" }
            ];

            document.getElementById('appContent').innerHTML = `
                <div class="max-w-3xl mx-auto px-4 py-12">
                    <div class="text-center mb-12">
                        <span class="bg-sky-100 text-sky-600 text-xs font-bold px-3 py-1 rounded-full mb-4 inline-block">Order #${orderId}</span>
                        <h1 class="text-3xl font-bold text-slate-900 mb-2">Track Your Delivery</h1>
                        <p class="text-slate-500">Estimated Delivery: Tomorrow, 10 AM - 2 PM</p>
                    </div>

                    <div class="bg-white p-8 rounded-3xl border border-slate-100 shadow-sm relative overflow-hidden">
                        <div class="space-y-12 relative">
                            <!-- Connection Line -->
                            <div class="absolute left-[19px] top-4 bottom-4 w-0.5 bg-slate-100 -z-10"></div>

                            ${steps.map((step, i) => `
                                <div class="flex gap-6 group">
                                    <div class="w-10 h-10 rounded-full flex items-center justify-center shrink-0 z-10 transition-all ${
                                        step.status === 'completed' ? 'bg-emerald-500 text-white shadow-lg shadow-emerald-100' :
                                        step.status === 'active' ? 'bg-sky-500 text-white shadow-lg shadow-sky-100' : 'bg-slate-100 text-slate-300'
                                    }">
                                        <i class="fa-solid ${step.icon} text-sm"></i>
                                    </div>
                                    <div class="flex-1">
                                        <h4 class="font-bold ${step.status === 'pending' ? 'text-slate-300' : 'text-slate-800'} transition-all">${step.title}</h4>
                                        <p class="text-sm text-slate-400">${step.desc}</p>
                                    </div>
                                    <div class="text-[10px] text-slate-300 font-mono self-center">
                                        ${step.status === 'completed' ? '12:45 PM' : step.status === 'active' ? 'IN PROGRESS' : '--:--'}
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>

                    <button onclick="showPage('home')" class="mt-12 w-full text-center text-sky-600 font-bold hover:underline">Back to Shop</button>
                </div>
            `;
        }

        function renderHistory() {
            document.getElementById('appContent').innerHTML = `
                <div class="max-w-5xl mx-auto px-4 py-8">
                    <h1 class="text-2xl font-bold text-slate-900 mb-8 flex items-center gap-3">
                        <i class="fa-solid fa-clock-rotate-left text-sky-600"></i> Purchase History
                    </h1>

                    <div class="space-y-4">
                        ${orders.map(order => `
                            <div class="bg-white rounded-2xl border border-slate-100 p-6 flex flex-col md:flex-row md:items-center gap-6 group hover:border-sky-200 transition-all shadow-sm">
                                <div class="w-16 h-16 bg-sky-50 rounded-2xl flex items-center justify-center text-sky-500 shrink-0">
                                    <i class="fa-solid fa-box text-2xl transition-transform group-hover:scale-110"></i>
                                </div>
                                <div class="flex-1">
                                    <div class="flex items-center gap-3 mb-1">
                                        <span class="font-bold text-slate-800">${order.id}</span>
                                        <span class="px-2 py-0.5 rounded text-[10px] font-bold ${
                                            order.status === 'Delivered' ? 'bg-emerald-100 text-emerald-600' : 'bg-sky-100 text-sky-600'
                                        }">${order.status.toUpperCase()}</span>
                                    </div>
                                    <p class="text-xs text-slate-400">Placed on ${order.date} • ${order.items} Items</p>
                                </div>
                                <div class="text-right flex md:flex-col items-center md:items-end justify-between gap-2">
                                    <span class="text-lg font-black text-slate-900">$${order.total.toFixed(2)}</span>
                                    <div class="flex gap-2">
                                        <button onclick="showPage('tracking', '${order.id}')" class="text-xs font-bold text-sky-600 hover:text-sky-700 bg-sky-50 px-4 py-2 rounded-lg">Track</button>
                                        <button onclick="reorder('${order.id}')" class="text-xs font-bold text-white bg-slate-900 hover:bg-slate-800 px-4 py-2 rounded-lg">Reorder</button>
                                    </div>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        // --- INTERACTION LOGIC ---

        function addToCart(productId, quantity = 1) {
            const product = PRODUCTS.find(p => p.id === productId);
            const existing = cart.find(item => item.id === productId);

            if (existing) {
                existing.qty = Math.max(0, existing.qty + quantity);
                if (existing.qty === 0) {
                    cart = cart.filter(item => item.id !== productId);
                }
            } else if (quantity > 0) {
                cart.push({ ...product, qty: quantity });
            }

            updateCartUI();
            if(quantity > 0) notify(`Added ${product.name} to cart`);

            // Re-render current view if it's cart
            const currentView = document.getElementById('cartTotal');
            if(currentView) renderCart();
        }

        function removeFromCart(id) {
            const item = cart.find(i => i.id === id);
            cart = cart.filter(i => i.id !== id);
            updateCartUI();
            notify(`Removed ${item.name}`, 'error');
            renderCart();
        }

        function updateCartUI() {
            const count = cart.reduce((sum, item) => sum + item.qty, 0);
            const badges = [document.getElementById('cartCount'), document.getElementById('mobileCartCount')];

            badges.forEach(badge => {
                if(badge) {
                    badge.innerText = count;
                    badge.classList.toggle('hidden', count === 0);
                }
            });
        }

        function updateQtyDetail(delta) {
            const input = document.getElementById('detailQty');
            let val = parseInt(input.value) + delta;
            input.value = Math.max(1, val);
        }

        function setCategory(cat) {
            currentCategory = cat;
            renderHome();
        }

        function handleSearch() {
            searchQuery = document.getElementById('searchInput').value;
            // Only re-render if on home page
            if(document.querySelector('.product-card') || document.querySelector('.fa-box-open')) {
                renderHome();
            }
        }

        function placeOrder(e) {
            e.preventDefault();
            const orderId = "ORD-" + Math.floor(1000 + Math.random() * 9000);
            const total = cart.reduce((sum, item) => sum + (item.price * item.qty), 0) * 1.05;

            orders.unshift({
                id: orderId,
                date: new Date().toISOString().split('T')[0],
                status: "Pending",
                total: total,
                items: cart.length
            });

            cart = [];
            updateCartUI();
            notify("Order placed successfully!");
            showPage('tracking', orderId);
        }

        function reorder(orderId) {
            // Simplified: Add first product of the old order back to cart
            addToCart(1, 1);
            showPage('cart');
        }

        // Initialize App
        window.onload = init;
    </script>
</body>
</html>
